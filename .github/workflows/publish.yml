name: Publish Release & npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to release if triggering manually (e.g. v0.1.0)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Release
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/agstatusline'
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine Target Git Ref
        id: target
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve Release Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun pm pack --destination "$RUNNER_TEMP"
      - run: cd "$RUNNER_TEMP" && sha256sum agstatusline-*.tgz > SHA256SUMS

      - name: Save Release Tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            ${{ runner.temp }}/agstatusline-*.tgz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-and-verify
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download Release Tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: release-tarball

      - name: Resolve Tarball Path
        id: tarball
        run: |
          TARBALL=$(ls -d "$PWD"/release-tarball/agstatusline-*.tgz)
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build-and-verify.outputs.tag_name }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "agstatusline $TAG" --notes "Source release; the packed CLI and its checksum are attached." --verify-tag
          gh release upload "$TAG" --repo "$REPO" "${{ steps.tarball.outputs.path }}" release-tarball/SHA256SUMS --clobber

      - name: Upgrade npm for native OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish "${{ steps.tarball.outputs.path }}" --provenance --access public
